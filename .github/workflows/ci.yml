name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Same as local development and the Vercel runtime (vercel-php@0.9.0).
          php-version: '8.5'
          # gd, zip and fileinfo: phpoffice/phpspreadsheet (exports); sockets: pestphp/pest-plugin-browser.
          # composer install refuses to run if any is missing, so they are listed rather than assumed.
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite, gd, zip, fileinfo, sockets
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      # public/build is not committed: Vercel builds it on deploy, and the views' @vite() needs a manifest here.
      - name: Build front-end assets
        run: npm run build

      - name: JavaScript tests
        run: npm run test:js

      # The Browser test suite (pestphp/pest-plugin-browser) drives a real Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run migrations
        run: php artisan migrate --force

      # Fails on any advisory. To accept one deliberately, allow-list that advisory ID in composer.json (Composer
      # 2.11 names the setting policy.advisories.ignore-id) and give the reason in the commit; never `|| true`.
      - name: Security Audit - Composer
        run: composer audit --locked --format=plain

      # Packages that ship (everything in "dependencies", which here includes the Vite/Tailwind build tools that
      # produce public/build) must be clean at moderate and above.
      - name: Security Audit - NPM (production, strict)
        run: npm audit --omit=dev --audit-level=moderate

      # devDependencies (Playwright for the browser tests) are reported but never fail the build.
      - name: Security Audit - NPM (dev, report only)
        run: npm audit --audit-level=moderate || echo "::warning::npm audit found advisories in devDependencies (report only)"

      - name: Code Style Check (Mago)
        run: vendor/bin/mago format --check

      - name: Lint (Mago)
        run: vendor/bin/mago lint

      - name: Static Analysis (Mago)
        run: vendor/bin/mago analyze

      - name: Static Analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run Tests
        run: php artisan test --no-coverage
