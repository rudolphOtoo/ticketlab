name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Configure database for testing
        run: |
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=sqlite/' .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Security Audit - Composer
        run: composer audit --format=plain || true

      - name: Security Audit - NPM
        run: npm audit --audit-level=moderate || true

      - name: Code Style Check (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Static Analysis (PHPStan/Larastan)
        run: composer types:check || vendor/bin/phpstan analyse --no-progress

      - name: Run Tests
        run: php artisan test --no-coverage
